<!-- gold_sea.svg — Montanha colossal de moedas, "Mar de Ouro", pixel art -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 56" width="128" height="112"
     shape-rendering="crispEdges" image-rendering="pixelated">
  <title>Mar de Ouro</title>
  <defs>
    <radialGradient id="seaGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#fff9c4"/>
      <stop offset="30%"  stop-color="#ffd700"/>
      <stop offset="70%"  stop-color="#c9a000"/>
      <stop offset="100%" stop-color="#6d4c00"/>
    </radialGradient>
    <radialGradient id="seaBase" cx="50%" cy="80%" r="60%">
      <stop offset="0%"   stop-color="#a07000"/>
      <stop offset="100%" stop-color="#3a2800"/>
    </radialGradient>
    <!-- Background abyss gradient -->
    <linearGradient id="abyssGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a0510"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
  </defs>

  <!-- Abyss background -->
  <rect x="0" y="0" width="64" height="56" fill="url(#abyssGrad)"/>

  <!-- Far background mountains of gold (dark) -->
  <rect x="0"  y="38" width="64" height="18" fill="#3a2800"/>
  <!-- Far mountain silhouettes -->
  <polygon points="0,38 10,28 20,38"  fill="#2e2000"/>
  <polygon points="12,38 24,22 36,38" fill="#2e2000"/>
  <polygon points="30,38 44,24 58,38" fill="#2e2000"/>
  <polygon points="50,38 60,30 64,38" fill="#2e2000"/>

  <!-- Mid layer coin sea -->
  <rect x="2"  y="38" width="60" height="16" fill="#a07000"/>
  <!-- Coin tops — mid layer -->
  <ellipse cx="8"  cy="38" rx="5" ry="2" fill="#c9a800"/>
  <ellipse cx="18" cy="38" rx="5" ry="2" fill="#ffd700"/>
  <ellipse cx="28" cy="38" rx="5" ry="2" fill="#ffe082"/>
  <ellipse cx="38" cy="38" rx="5" ry="2" fill="#ffd700"/>
  <ellipse cx="48" cy="38" rx="5" ry="2" fill="#c9a800"/>
  <ellipse cx="58" cy="38" rx="4" ry="2" fill="#b89000"/>

  <!-- Main mountain of coins — center peak -->
  <polygon points="8,40 32,8 56,40" fill="url(#seaGlow)"/>

  <!-- Layer shading (left face) -->
  <polygon points="8,40 32,8 20,40" fill="#c9a000" opacity="0.3"/>

  <!-- Coin stacks on the mountain -->
  <!-- Bottom row -->
  <ellipse cx="12" cy="40" rx="5" ry="2" fill="#ffe082"/>
  <ellipse cx="22" cy="38" rx="5" ry="2" fill="#fff176"/>
  <ellipse cx="32" cy="36" rx="5" ry="2" fill="#fff9c4"/>
  <ellipse cx="42" cy="38" rx="5" ry="2" fill="#fff176"/>
  <ellipse cx="52" cy="40" rx="5" ry="2" fill="#ffe082"/>

  <!-- Second row -->
  <ellipse cx="16" cy="33" rx="4" ry="2" fill="#ffd700"/>
  <ellipse cx="26" cy="29" rx="4" ry="2" fill="#ffe082"/>
  <ellipse cx="36" cy="27" rx="4" ry="2" fill="#fff176"/>
  <ellipse cx="46" cy="29" rx="4" ry="2" fill="#ffe082"/>

  <!-- Third row -->
  <ellipse cx="20" cy="25" rx="3" ry="2" fill="#fff176"/>
  <ellipse cx="30" cy="20" rx="3" ry="2" fill="#fff9c4"/>
  <ellipse cx="40" cy="23" rx="3" ry="2" fill="#fff176"/>

  <!-- Peak coins -->
  <ellipse cx="32" cy="14" rx="4" ry="2" fill="#fffde7"/>
  <ellipse cx="32" cy="12" rx="3" ry="2" fill="#fff"/>

  <!-- Glint sparkles — animated -->
  <rect x="30" y="10" width="2" height="2" fill="#fff" opacity="0.95">
    <animate attributeName="opacity" values="0.95;0.3;0.95" dur="1s"    repeatCount="indefinite"/>
  </rect>
  <rect x="20" y="22" width="2" height="2" fill="#fff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8"   dur="1.4s"   repeatCount="indefinite"/>
  </rect>
  <rect x="42" y="20" width="2" height="2" fill="#fff" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0;0.7"   dur="1.9s"  repeatCount="indefinite"/>
  </rect>
  <rect x="14" y="34" width="2" height="2" fill="#fff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0;0.6"   dur="2.2s"  repeatCount="indefinite"/>
  </rect>
  <rect x="50" y="35" width="2" height="2" fill="#fff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.6s"  repeatCount="indefinite"/>
  </rect>
  <rect x="26" y="16" width="1" height="1" fill="#fffde7" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="0.8s"  repeatCount="indefinite"/>
  </rect>

  <!-- Base / ground -->
  <rect x="0"  y="48" width="64" height="8" fill="url(#seaBase)"/>
  <!-- Base coin tops -->
  <ellipse cx="8"  cy="48" rx="6" ry="2" fill="#a07000"/>
  <ellipse cx="20" cy="48" rx="7" ry="2" fill="#b89000"/>
  <ellipse cx="32" cy="48" rx="8" ry="3" fill="#c9a000"/>
  <ellipse cx="44" cy="48" rx="7" ry="2" fill="#b89000"/>
  <ellipse cx="56" cy="48" rx="6" ry="2" fill="#a07000"/>

  <!-- Atmospheric fog at base (depth effect) -->
  <rect x="0" y="42" width="64" height="6" fill="#0a0510" opacity="0.3"/>
</svg>
