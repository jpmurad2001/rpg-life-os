<!-- gold_many.svg — Pilha grande de moedas, estilo pixel art -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="80" height="80"
     shape-rendering="crispEdges" image-rendering="pixelated">
  <title>Muitas Moedas de Ouro</title>
  <defs>
    <radialGradient id="gm" cx="38%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#fff59d"/>
      <stop offset="40%"  stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </radialGradient>
    <radialGradient id="gm2" cx="50%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#a07000"/>
    </radialGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="20" cy="37" rx="14" ry="3" fill="#000" opacity="0.3"/>

  <!-- Stack of 7 coins -->
  <!-- Coin 7 -->
  <rect x="5" y="30" width="30" height="3" fill="#8a6200"/>
  <ellipse cx="20" cy="30" rx="14" ry="4" fill="url(#gm2)"/>

  <!-- Coin 6 -->
  <rect x="5" y="26" width="30" height="3" fill="#9a7000"/>
  <ellipse cx="20" cy="26" rx="14" ry="4" fill="url(#gm2)"/>

  <!-- Coin 5 -->
  <rect x="5" y="22" width="30" height="3" fill="#a07800"/>
  <ellipse cx="20" cy="22" rx="14" ry="4" fill="url(#gm)"/>

  <!-- Coin 4 -->
  <rect x="5" y="18" width="30" height="3" fill="#a07800"/>
  <ellipse cx="20" cy="18" rx="14" ry="4" fill="url(#gm)"/>

  <!-- Coin 3 -->
  <rect x="5" y="14" width="30" height="3" fill="#b08800"/>
  <ellipse cx="20" cy="14" rx="14" ry="4" fill="url(#gm)"/>

  <!-- Coin 2 -->
  <rect x="5" y="10" width="30" height="3" fill="#b89000"/>
  <ellipse cx="20" cy="10" rx="14" ry="4" fill="url(#gm)"/>

  <!-- Coin 1 (top) -->
  <rect x="5" y="6" width="30" height="3" fill="#c0a000"/>
  <ellipse cx="20" cy="6" rx="14" ry="4" fill="url(#gm)"/>

  <!-- Top highlight -->
  <rect x="9"  y="3" width="5" height="2" fill="#fff" opacity="0.6"/>
  <rect x="9"  y="5" width="2" height="1" fill="#fff" opacity="0.4"/>

  <!-- Glint sparkle -->
  <rect x="30" y="5"  width="2" height="2" fill="#fff" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1.8s" repeatCount="indefinite"/>
  </rect>
</svg>
